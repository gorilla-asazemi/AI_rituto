<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Organic Rubber Stamp Texture -->
    <filter id="hanko-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Red Stamp Outer Frame (Organic rounded squarish stamp base) -->
  <path d="M 170 110 
           C 240 102, 360 102, 430 110 
           C 485 118, 500 160, 495 240 
           C 490 320, 500 390, 485 440 
           C 470 480, 420 490, 350 488 
           C 270 485, 200 488, 150 485 
           C 110 480, 95 440, 105 380 
           C 115 320, 105 240, 110 180 
           C 115 130, 130 115, 170 110 Z" 
        fill="#e8201a" filter="url(#hanko-texture)" />

  <!-- LEFT: Microphone & White Hand Grip -->
  <!-- White Hand outline & fingers -->
  <g>
    <!-- White hand body -->
    <path d="M 120 270 
             C 80 270, 70 310, 80 340 
             C 90 365, 130 365, 150 350 
             C 170 335, 165 295, 145 275 
             C 135 268, 128 270, 120 270 Z" 
          fill="#ffffff" stroke="#e8201a" stroke-width="8" />
    <!-- Finger dividers (red lines) -->
    <path d="M 125 300 C 105 300, 95 308, 90 318" fill="none" stroke="#e8201a" stroke-width="8" stroke-linecap="round" />
    <path d="M 130 328 C 110 328, 100 336, 95 345" fill="none" stroke="#e8201a" stroke-width="8" stroke-linecap="round" />
    
    <!-- Microphone Handle (White) -->
    <path d="M 98 245 L 115 245 L 120 280 L 95 280 Z" fill="#ffffff" />

    <!-- Microphone Head (Round red ball with thick white grid) -->
    <circle cx="102" cy="205" r="42" fill="#e8201a" stroke="#ffffff" stroke-width="9" />
    <!-- Grid inside Mic -->
    <line x1="72" y1="205" x2="132" y2="205" stroke="#ffffff" stroke-width="6" />
    <line x1="102" y1="175" x2="102" y2="235" stroke="#ffffff" stroke-width="6" />
    <line x1="78" y1="183" x2="126" y2="227" stroke="#ffffff" stroke-width="6" />
    <line x1="78" y1="227" x2="126" y2="183" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- CENTER: Gorilla White Head Silhouette -->
  <!-- Shape matching the exact hand-drawn silhouette -->
  <path d="M 260 160 
           L 340 160 
           C 375 160, 390 190, 400 220 
           L 440 260 
           C 455 275, 450 295, 435 315 
           L 395 375 
           C 380 395, 360 400, 330 400 
           L 270 400 
           C 240 400, 220 395, 205 375 
           L 165 315 
           C 150 295, 145 275, 160 260 
           L 200 220 
           C 210 190, 225 160, 260 160 Z" 
        fill="#ffffff" />

  <!-- GORILLA FACE FEATURES (Red #e8201a) -->
  <!-- 3 Forehead Wrinkles -->
  <path d="M 275 182 L 325 182" stroke="#e8201a" stroke-width="11" stroke-linecap="round" />
  <path d="M 262 198 L 338 198" stroke="#e8201a" stroke-width="11" stroke-linecap="round" />
  <path d="M 275 214 L 325 214" stroke="#e8201a" stroke-width="11" stroke-linecap="round" />

  <!-- Eyes & Eyebrows (Strong slanted confident look) -->
  <!-- Left Eye -->
  <path d="M 230 238 Q 260 242 275 252" stroke="#e8201a" stroke-width="14" stroke-linecap="round" fill="none" />
  <!-- Right Eye -->
  <path d="M 370 238 Q 340 242 325 252" stroke="#e8201a" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- Gorilla Snout / Big Oval Nose -->
  <ellipse cx="300" cy="295" rx="46" ry="30" fill="#e8201a" />
  <!-- Two Nostrils (White) -->
  <circle cx="282" cy="296" r="11" fill="#ffffff" />
  <circle cx="318" cy="296" r="11" fill="#ffffff" />

  <!-- Smile Mouth -->
  <path d="M 260 340 Q 300 365 340 340" fill="none" stroke="#e8201a" stroke-width="11" stroke-linecap="round" />

  <!-- BOTTOM: White Text "@ゴリーダー" -->
  <!-- Stylized Japanese Hand-Carved Stamp Text -->
  <g fill="#ffffff" transform="translate(0, 460)">
    <!-- @ -->
    <path d="M 160 -18 C 145 -18, 132 -5, 132 10 C 132 25, 145 38, 160 38 C 175 38, 185 28, 186 16 L 174 16 C 173 22, 168 28, 160 28 C 150 28, 144 20, 144 10 C 144 0, 150 -8, 160 -8 C 168 -8, 174 -2, 175 6 L 175 14 C 175 20, 178 22, 183 22 C 188 22, 191 18, 191 12 L 191 -6 L 180 -6 L 180 4 C 176 -2, 169 -6, 160 -6 C 152 -6, 147 0, 147 6 C 147 12, 152 17, 160 17 C 166 17, 171 13, 174 8 L 174 10 Z" />
    
    <!-- ゴ -->
    <path d="M 205 -12 L 245 -12 L 245 -3 L 205 -3 Z M 205 12 L 235 12 L 235 22 L 205 22 Z M 212 -12 L 212 28 L 222 28 L 222 -12 Z M 248 -18 L 255 -18 L 253 -10 L 246 -10 Z M 255 -16 L 262 -16 L 260 -8 L 253 -8 Z" />
    
    <!-- リ -->
    <path d="M 278 -12 L 288 -12 L 288 12 Q 288 20 282 24 L 274 18 Q 278 16 278 10 Z M 305 -15 L 316 -15 L 316 22 Q 316 32 300 36 L 296 26 Q 305 24 305 18 Z" />
    
    <!-- ー -->
    <path d="M 330 4 Q 355 -2 375 4 L 373 15 Q 355 9 330 15 Z" />
    
    <!-- ダ -->
    <path d="M 390 -10 L 428 -10 L 428 -1 L 390 -1 Z M 392 6 L 432 6 L 432 15 L 392 15 Z M 406 -10 L 395 30 L 405 32 L 416 -10 Z M 418 8 L 434 28 L 424 34 L 410 14 Z M 433 -16 L 440 -16 L 438 -9 L 431 -9 Z M 440 -14 L 447 -14 L 445 -7 L 438 -7 Z" />
    
    <!-- ー -->
    <path d="M 456 4 Q 478 -2 495 4 L 493 15 Q 478 9 456 15 Z" />
  </g>
</svg>
